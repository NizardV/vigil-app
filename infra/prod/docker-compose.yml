# Vigil en production (VPS). Lancer depuis ce dossier :
#   docker compose --env-file vigil.env up -d
# vigil.env (secrets) reste sur le serveur, jamais dans le dépôt : modèle dans vigil.env.example.
# Ports publiés sur 127.0.0.1 uniquement : seul NGINX (hôte) est exposé à Internet.

name: vigil

x-app: &app
  image: ghcr.io/nizardv/vigil:${VIGIL_TAG:-latest}
  restart: unless-stopped
  env_file: vigil.env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    <<: *app
    restart: "no"
    command: python manage.py migrate --noinput

  web:
    <<: *app
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: python manage.py procrastinate worker
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
