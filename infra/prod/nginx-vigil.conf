# Site NGINX de l'hôte (à placer dans /etc/nginx/sites-available/vigil.nizard.dev). Remplace l'ancien site Vigil.
# Les certificats Let's Encrypt de vigil.nizard.dev existent déjà : on reprend les mêmes chemins que l'ancien site.
server {
    listen 80;
    server_name vigil.nizard.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vigil.nizard.dev;

    ssl_certificate     /etc/letsencrypt/live/vigil.nizard.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vigil.nizard.dev/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
