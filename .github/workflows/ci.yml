name: CI
on:
  pull_request:
  workflow_call:   # réutilisé par deploy.yml (les tests passent avant tout déploiement)
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vigil
          POSTGRES_USER: vigil
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vigil" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_DB: vigil
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: ci
      POSTGRES_HOST: localhost
      DJANGO_DEBUG: "1"
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # SonarCloud a besoin de l'historique pour attribuer les nouveaux problèmes
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check src
      - run: uv run ruff format --check src
      - run: PYTHONPATH=src uv run lint-imports
      - run: uv run python src/manage.py makemigrations --check --dry-run
      - run: uv run coverage run src/manage.py test modules core
      - run: uv run coverage xml
      - name: Analyse SonarCloud
        # Sans jeton (PR Dependabot, fork) : l'étape est ignorée, le reste du CI reste valide.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.4.1
